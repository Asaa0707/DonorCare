<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
    <link rel="stylesheet" href="styleformlogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

</head>

<body>
    <div class="login-box">
        <div class="header">
            <h1>Login Dulu Yukk!!</h1>
        </div>
        <div class="form">
            <form action="../DONOR DARAH 3 FILE/index.html" method="get">
                <h4>Masukkan Username Anda</h4>
                <input type="text" placeholder="Masukan Username" required>
                <h4>Masukkan Password Anda</h4>
                <input type="password" placeholder="Masukan Password" required>
                <div class="remember">
                    <label>
                        <input type="checkbox" required>
                        Ingatkan saya
                    </label>
                    <a href="lupapw.html">Lupa password?</a>
                </div>
                <button type="submit">Login</button>
                <p>
                    Belum menjadi anggota?
                    <a href="daftarsekarang.html">Daftar Sekarang</a>
                </p>
        </div>
    </div>
</body>

</html>
