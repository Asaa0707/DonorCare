
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran Peserta Donor Darah</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <header>
            <h1>Pendaftaran Peserta Donor Darah</h1>
            <p>
                Mari berbagi kebaikan dan membantu menyelamatkan nyawa melalui donor
                darah
            </p>
        </header>

        <form id="formDonor">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Contoh: nama@gmail.com" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required />
            </div>

            <div class="form-group">
                <label for="umur">Umur</label>
                <input type="number" id="umur" min="17" placeholder="Masukkan umur" required />
            </div>

            <div class="form-group">
                <label>Jenis Kelamin</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="jenis_kelamin" value="Laki-laki" required />
                        Laki-laki
                    </label>
                    <label>
                        <input type="radio" name="jenis_kelamin" value="Perempuan" />
                        Perempuan
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="golongan">Golongan Darah</label>
                <select id="golongan" required>
                    <option value="">PILIH GOLONGAN DARAHMU</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="AB">AB</option>
                    <option value="O">O</option>
                </select>
            </div>

            <div class="form-group">
                <label for="telepon">Nomor HP</label>
                <input type="text" id="telepon" placeholder="Contoh: 081234567890" required />
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Lengkap</label>
                <textarea id="alamat" rows="4" placeholder="Masukkan alamat lengkap" required></textarea>
            </div>

            <div class="form-group">
                <label for="jadwal">Jadwal Donor Darah</label>
                <select id="jadwal" required>
                    <option value="">PILIH JADWAL DONOR</option>
                    <option value="Pagi (08.00 - 11.00)">Pagi (08.00 - 11.00)</option>
                    <option value="Siang (13.00 - 15.00)">Siang (13.00 - 15.00)</option>
                    <option value="Sore (15.00 - 17.00)">Sore (15.00 - 17.00)</option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" id="persetujuan" required />
                    Saya bersedia mengikuti proses donor darah dan memberikan data
                    dengan benar.
                </label>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-kirim" id="btnKirim">
                    Kirim Pendaftaran
                </button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>
        </form>

        <footer class="footer-copyright">
            &copy; 2026 Pendaftaran Donor Darah. All rights reserved.
        </footer>
    </div>

    <script>
        const form = document.getElementById("formDonor");
        const params = new URLSearchParams(window.location.search);
        const editId = params.get("edit");

        let dataPendonor = JSON.parse(localStorage.getItem("dataDonor")) || [];

        if (!Array.isArray(dataPendonor)) {
            dataPendonor = [dataPendonor];
        }

        // Jika halaman dibuka untuk mengedit data
        if (editId) {
            const dataLama = dataPendonor.find(item => item.id == editId);

            if (dataLama) {
                document.getElementById("nama").value = dataLama.nama;
                document.getElementById("email").value = dataLama.email;
                document.getElementById("umur").value = dataLama.umur;
                document.getElementById("golongan").value = dataLama.golongan;
                document.getElementById("telepon").value = dataLama.telepon;
                document.getElementById("alamat").value = dataLama.alamat;
                document.getElementById("jadwal").value = dataLama.jadwal;

                document.querySelector(
                    `input[name="jenis_kelamin"][value="${dataLama.jenisKelamin}"]`
                ).checked = true;

                document.getElementById("persetujuan").checked =
                    dataLama.persetujuan === "Disetujui";

                document.getElementById("password").required = false;
                document.getElementById("password").placeholder =
                    "Kosongkan jika tidak ingin mengubah password";

                document.getElementById("btnKirim").textContent = "Simpan Perubahan";
                document.querySelector("header h1").textContent =
                    "Ubah Data Pendonor";
            } else {
                alert("Data pendonor tidak ditemukan!");
                window.location.href = "data.html";
            }
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const jenisKelamin = document.querySelector(
                'input[name="jenis_kelamin"]:checked'
            );

            const passwordInput = document.getElementById("password").value;

            const dataDonor = {
                id: editId ? Number(editId) : Date.now(),
                nama: document.getElementById("nama").value,
                email: document.getElementById("email").value,
                password: "••••••••",
                umur: document.getElementById("umur").value,
                jenisKelamin: jenisKelamin.value,
                golongan: document.getElementById("golongan").value,
                telepon: document.getElementById("telepon").value,
                alamat: document.getElementById("alamat").value,
                jadwal: document.getElementById("jadwal").value,
                persetujuan: "Disetujui"
            };

            if (editId) {
                const index = dataPendonor.findIndex(item => item.id == editId);

                if (index !== -1) {
                    dataPendonor[index] = dataDonor;
                    if (!passwordInput) {
                        dataDonor.password = dataPendonor[index].password;
                    }
                }
            } else {
                dataPendonor.push(dataDonor);
            }

            localStorage.setItem("dataDonor", JSON.stringify(dataPendonor));

            window.location.href = editId
                ? "data.html"
                : "output.html?id=" + dataDonor.id;
        });
    </script>
</body>
</html>
